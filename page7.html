<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мини-игра</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #c8f7b8, #f7d7b8);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        width: 90%;
        max-width: 400px;
        background: white;
        border-radius: 20px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    .characters img {
        width: 70%;
        max-width: 200px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 14px;
        margin-top: 10px;
        background: #6c63ff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button.red {
        background: #ff5252;
    }

    .nav-buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .nav-buttons button {
        flex: 1;
        background: #444;
    }

    .end-img {
        width: 70%;
        margin: 10px auto;
        display: block;
    }
</style>

</head>
<body>

<div class="card" id="game">

    <h2>Басқа балалар сыныптасынды кемсітіп жатыр, сенің шешімін?</h2>

    <div class="characters">
        <img src="img/fhobia.png" alt="буллинг">
    </div>

    <button onclick="helpGirl()">🤝 Көмектесу</button>
    <button class="red" onclick="bullyGirl()">😈 Бірге кемсіту</button>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-buttons">
        <button onclick="history.back()">⬅️ Назад</button>
        <button onclick="goNext()">➡️ Вперёд</button>
    </div>

</div>

<script>
function helpGirl() {
    document.getElementById("game").innerHTML = `
        <h2>Көмектескен үшін рақмет! ❤️</h2>
        <img src="img/drug.png" class="end-img">
        <p>Енді сіз доссыздар!</p>

        <div class="nav-buttons">
            <button onclick="history.back(page6.html)">⬅️ Артқа</button>
            <button onclick="goNext(page8.html)">➡️ Алдыға</button>
        </div>
    `;
}

function bullyGirl() {
    document.getElementById("game").innerHTML = `
        <h2>Сен дұрыс жолды таңдамадың 😢</h2>
        <p>Кемсітіп, ренжітуге жол жоқ.</p>

        <button onclick="location.reload()">🔄 Қайталау</button>

        <div class="nav-buttons">
            <button onclick="history.back(page6.html)">⬅️ Назад</button>
            <button onclick="goNext(page8.html)">➡️ Вперёд</button>
        </div>
    `;
}

// 👉 УКАЖИ СЮДА СЛЕДУЮЩУЮ СТРАНИЦУ
function goNext(page8.html) {
    window.location.href = "page7.html"; // поменяй на свой файл
}
</script>

</body>
</html>
