<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мини-игра</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #c8f7b8, #f7d7b8);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        width: 90%;
        max-width: 400px;
        background: white;
        border-radius: 20px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        animation: fade 0.3s ease;
    }

    @keyframes fade {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .characters {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
    }

    .characters img {
        width: 30%;
        max-width: 100px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 14px;
        margin-top: 15px;
        background: #6c63ff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button.red {
        background: #ff5252;
    }

    .end-img {
        width: 70%;
        margin: 0 auto;
        display: block;
    }
</style>

</head>
<body>

<div class="card" id="game">

    <h2>Басқа балалар сыныптасынды кемсітіп жатыр, сенің шешімін?</h2>

    <div class="characters">
    
     <img id="main-img" src="img/fhobia.html" alt="буллинг">
    </div>

    <button onclick="helpGirl()">🤝 Көмектесу</button>
    <button class="red" onclick="bullyGirl()">😈 Бірге кемсіту</button>

</div>

<script>
function helpGirl() {
    document.getElementById("game").innerHTML = `
        <h2>Көмектескен үшін рақмет! ❤️</h2>
        <button onclick="history.back(page5.html)">⬅️ Назад</button>
    <button onclick="location.href='page7.html'">➡️ Вперёд</button>
`;
        <img src="img/drug.img" class="end-img">
        <p>Енді сіз доссыздар!</p>
    `;
}

function bullyGirl() {
    document.getElementById("game").innerHTML = `
        <h2>Сен дұрыс жолды таңдамадың 😢</h2>
        <p>Кемсітіп, ренжітуге жол жоқ.</p>
        <button onclick="location.reload()">🔄 Қайталау</button>
    `;
}
</script>

</body>
</html>
